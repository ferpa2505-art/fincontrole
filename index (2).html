<div class="type-toggle">
  <button class="type-btn income active" id="btnTypeIncome" data-i18n="modal.income">Entrada (recebimento)</button>
  <button class="type-btn expense" id="btnTypeExpense" data-i18n="modal.expense">Saída (pagamento)</button>
</div>

<label class="field-label" data-i18n="modal.description">Descrição</label>
<input type="text" id="fieldDescription" class="big-input" placeholder="Ex: Salário, Aluguel, Luz...">

<label class="field-label" data-i18n="modal.invoicedTo">Faturado para (cliente)</label>
<input type="text" id="fieldInvoicedTo" class="big-input" placeholder="Ex: Blaine Pollock, Direct Pay AG...">

<label class="field-label" data-i18n="modal.category">Categoria</label>
<select id="fieldCategory" class="big-select"></select>

<label class="field-label" data-i18n="modal.amount">Valor (R$)</label>
<input type="text" inputmode="decimal" id="fieldAmount" class="big-input" placeholder="0,00">

<label class="field-label" data-i18n="modal.account">Conta</label>
<select id="fieldAccount" class="big-select"></select>

<label class="field-label" data-i18n="modal.date">Data</label>
<input type="date" id="fieldDate" class="big-input">

<label class="field-label" data-i18n="modal.frequency">Frequência</label>
<select id="fieldFrequency" class="big-select">
  <option value="once" data-i18n="freq.once">Não se repete</option>
  <option value="daily" data-i18n="freq.daily">Repete todo dia</option>
  <option value="weekly" data-i18n="freq.weekly">Repete toda semana</option>
  <option value="monthly" data-i18n="freq.monthly">Repete todo mês</option>
  <option value="yearly" data-i18n="freq.yearly">Repete todo ano</option>
</select>

<label class="field-label" data-i18n="modal.endDate">Repetir até (opcional)</label>
<input type="date" id="fieldEndDate" class="big-input">

<label class="field-label" data-i18n="modal.notes">Observações (opcional)</label>
<input type="text" id="fieldNotes" class="big-input">
